spring.application.name=projetoTCC

spring.datasource.url=jdbc:postgresql://localhost:5432/hobby_recommendation2
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.profiles.active=test

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

ai.provider=gemini

gemini.model=gemini-3.1-flash-lite

security.ai-key-encryption-secret=${AI_KEY_ENCRYPTION_SECRET}

app.migration.hobby-location-rules=false

# Flyway
spring.flyway.enabled=true
#Habilitar baseline-on-migrate para true sempre que for um novo db
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

app.overpass.user-agent=Recommendi.a/1.0 (academic project; contact: recommendia.dev@gmail.com)

security.jwt.secret=${JWT_SECRET}